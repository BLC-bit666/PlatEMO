<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="980" viewBox="0 0 1650 980">
  <defs>
    <style>
      .bg { fill: #f6f7f8; }
      .outer { fill: #f6f7f8; stroke: #111111; stroke-width: 2.4; rx: 18; ry: 18; }
      .wire { stroke: #111111; stroke-width: 2.4; fill: none; }
      .wireThin { stroke: #111111; stroke-width: 2.0; fill: none; }
      .dash { stroke: #111111; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; }
      .input { fill: #000000; stroke: #000000; stroke-width: 2; }
      .neuron { fill: #8f8f8f; stroke: #000000; stroke-width: 4; }
      .arrow { fill: #111111; }
      .title { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 700; text-anchor: middle; }
      .section { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 26px; font-weight: 700; text-anchor: start; }
      .label { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .small { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; text-anchor: middle; }
      .dots { fill: #111111; font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1650" height="980"/>
  <text class="title" x="825" y="52">Region-CGAN 全连接节点结构</text>
  <rect class="outer" x="50" y="90" width="1550" height="840"/>
  <text class="section" x="90" y="135">CGAN = Generator G + Discriminator D</text>

  <!-- ================= Generator ================= -->
  <text class="section" x="90" y="205">G: z + W_ref -> x_fake</text>

  <!-- G input nodes -->
  <circle class="input" cx="145" cy="270" r="11"/>
  <circle class="input" cx="145" cy="330" r="11"/>
  <circle class="input" cx="145" cy="390" r="11"/>
  <text class="label" x="145" y="446">输入</text>
  <text class="small" x="145" y="472">z + W_ref</text>

  <!-- G hidden layer 1 -->
  <circle class="neuron" cx="350" cy="250" r="36"/>
  <circle class="neuron" cx="350" cy="330" r="36"/>
  <circle class="neuron" cx="350" cy="410" r="36"/>
  <text class="dots" x="350" y="492">⋮</text>
  <text class="label" x="350" y="532">隐藏层 1</text>
  <text class="small" x="350" y="558">32</text>

  <!-- G hidden layer 2 -->
  <circle class="neuron" cx="560" cy="250" r="36"/>
  <circle class="neuron" cx="560" cy="330" r="36"/>
  <circle class="neuron" cx="560" cy="410" r="36"/>
  <text class="dots" x="560" y="492">⋮</text>
  <text class="label" x="560" y="532">隐藏层 2</text>
  <text class="small" x="560" y="558">32</text>

  <!-- G output nodes -->
  <circle class="neuron" cx="770" cy="290" r="36"/>
  <circle class="neuron" cx="770" cy="370" r="36"/>
  <text class="dots" x="770" y="452">⋮</text>
  <text class="label" x="770" y="532">输出</text>
  <text class="small" x="770" y="558">x_fake</text>

  <!-- G fully connected input -> hidden1 -->
  <path class="wireThin" d="M 156 270 L 314 250"/>
  <path class="wireThin" d="M 156 270 L 314 330"/>
  <path class="wireThin" d="M 156 270 L 314 410"/>
  <path class="wireThin" d="M 156 330 L 314 250"/>
  <path class="wireThin" d="M 156 330 L 314 330"/>
  <path class="wireThin" d="M 156 330 L 314 410"/>
  <path class="wireThin" d="M 156 390 L 314 250"/>
  <path class="wireThin" d="M 156 390 L 314 330"/>
  <path class="wireThin" d="M 156 390 L 314 410"/>

  <!-- G hidden1 -> hidden2 -->
  <path class="wireThin" d="M 386 250 L 524 250"/>
  <path class="wireThin" d="M 386 250 L 524 330"/>
  <path class="wireThin" d="M 386 250 L 524 410"/>
  <path class="wireThin" d="M 386 330 L 524 250"/>
  <path class="wireThin" d="M 386 330 L 524 330"/>
  <path class="wireThin" d="M 386 330 L 524 410"/>
  <path class="wireThin" d="M 386 410 L 524 250"/>
  <path class="wireThin" d="M 386 410 L 524 330"/>
  <path class="wireThin" d="M 386 410 L 524 410"/>

  <!-- G hidden2 -> output -->
  <path class="wireThin" d="M 596 250 L 734 290"/>
  <path class="wireThin" d="M 596 250 L 734 370"/>
  <path class="wireThin" d="M 596 330 L 734 290"/>
  <path class="wireThin" d="M 596 330 L 734 370"/>
  <path class="wireThin" d="M 596 410 L 734 290"/>
  <path class="wireThin" d="M 596 410 L 734 370"/>

  <!-- G output arrows -->
  <path class="wire" d="M 806 290 L 950 290"/>
  <polygon class="arrow" points="970,290 948,278 948,302"/>
  <path class="wire" d="M 806 370 L 950 370"/>
  <polygon class="arrow" points="970,370 948,358 948,382"/>
  <text class="small" x="1025" y="294">生成候选解</text>
  <text class="small" x="1025" y="374">x_fake</text>

  <!-- ================= Discriminator ================= -->
  <text class="section" x="90" y="615">D: x_real / x_fake + W_ref -> score</text>

  <!-- D input nodes -->
  <circle class="input" cx="145" cy="690" r="11"/>
  <circle class="input" cx="145" cy="750" r="11"/>
  <circle class="input" cx="145" cy="810" r="11"/>
  <text class="label" x="145" y="882">输入</text>
  <text class="small" x="145" y="906">x + W_ref</text>

  <!-- D hidden layer 1 -->
  <circle class="neuron" cx="350" cy="670" r="36"/>
  <circle class="neuron" cx="350" cy="750" r="36"/>
  <circle class="neuron" cx="350" cy="830" r="36"/>
  <text class="label" x="350" y="882">隐藏层 1</text>
  <text class="small" x="350" y="906">32</text>

  <!-- D hidden layer 2 -->
  <circle class="neuron" cx="560" cy="670" r="36"/>
  <circle class="neuron" cx="560" cy="750" r="36"/>
  <circle class="neuron" cx="560" cy="830" r="36"/>
  <text class="label" x="560" y="882">隐藏层 2</text>
  <text class="small" x="560" y="906">32</text>

  <!-- D output -->
  <circle class="neuron" cx="770" cy="750" r="36"/>
  <text class="label" x="770" y="882">输出</text>
  <text class="small" x="770" y="906">score</text>

  <!-- D fully connected input -> hidden1 -->
  <path class="wireThin" d="M 156 690 L 314 670"/>
  <path class="wireThin" d="M 156 690 L 314 750"/>
  <path class="wireThin" d="M 156 690 L 314 830"/>
  <path class="wireThin" d="M 156 750 L 314 670"/>
  <path class="wireThin" d="M 156 750 L 314 750"/>
  <path class="wireThin" d="M 156 750 L 314 830"/>
  <path class="wireThin" d="M 156 810 L 314 670"/>
  <path class="wireThin" d="M 156 810 L 314 750"/>
  <path class="wireThin" d="M 156 810 L 314 830"/>

  <!-- D hidden1 -> hidden2 -->
  <path class="wireThin" d="M 386 670 L 524 670"/>
  <path class="wireThin" d="M 386 670 L 524 750"/>
  <path class="wireThin" d="M 386 670 L 524 830"/>
  <path class="wireThin" d="M 386 750 L 524 670"/>
  <path class="wireThin" d="M 386 750 L 524 750"/>
  <path class="wireThin" d="M 386 750 L 524 830"/>
  <path class="wireThin" d="M 386 830 L 524 670"/>
  <path class="wireThin" d="M 386 830 L 524 750"/>
  <path class="wireThin" d="M 386 830 L 524 830"/>

  <!-- D hidden2 -> output -->
  <path class="wireThin" d="M 596 670 L 734 750"/>
  <path class="wireThin" d="M 596 750 L 734 750"/>
  <path class="wireThin" d="M 596 830 L 734 750"/>

  <path class="wire" d="M 806 750 L 950 750"/>
  <polygon class="arrow" points="970,750 948,738 948,762"/>
  <text class="small" x="1034" y="754">real / fake score</text>

  <!-- x_fake into D input -->
  <path class="dash" d="M 970 370 C 1240 430 1215 650 980 690 C 720 735 360 640 160 730"/>
  <polygon class="arrow" points="145,738 158,718 168,742"/>
  <text class="small" x="1195" y="520">x_fake 输入 D</text>
</svg>
