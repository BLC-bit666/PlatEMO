<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="880" viewBox="0 0 1900 880">
  <defs>
    <style>
      .bg { fill: #171717; }
      .box { fill: #333333; stroke: #666666; stroke-width: 2.4; rx: 8; ry: 8; }
      .box2 { fill: #2b3a42; stroke: #6f8794; stroke-width: 2.4; rx: 8; ry: 8; }
      .box3 { fill: #3a3330; stroke: #8c7467; stroke-width: 2.4; rx: 8; ry: 8; }
      .line { fill: none; stroke: #d8d8d8; stroke-width: 2.6; }
      .arrow { fill: #d8d8d8; }
      .title { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 36px; font-weight: 600; text-anchor: middle; }
      .h { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 29px; font-weight: 600; text-anchor: middle; }
      .t { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; text-anchor: middle; }
      .s { fill: #ffffff; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 19px; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="880"/>
  <text class="title" x="950" y="52">当前 Region-CGAN 结构：输入、输出与内容结构</text>

  <!-- Data block -->
  <rect class="box" x="70" y="120" width="310" height="170"/>
  <text class="h" x="225" y="162">边界云数据 BMem</text>
  <text class="t" x="225" y="205">TrainX = x_b</text>
  <text class="s" x="225" y="235">近边界可行决策</text>
  <text class="t" x="225" y="266">TrainC = W_ref</text>

  <rect class="box" x="70" y="375" width="310" height="145"/>
  <text class="h" x="225" y="418">查询条件 QueryC</text>
  <text class="t" x="225" y="462">按区域方向查询</text>
  <text class="s" x="225" y="492">W_ref 表示目标区域</text>

  <!-- Generator -->
  <rect class="box2" x="500" y="105" width="420" height="245"/>
  <text class="h" x="710" y="150">Generator G</text>
  <text class="t" x="710" y="194">输入：[z ; W_ref]</text>
  <text class="s" x="710" y="224">zDim = 6，W_ref 维度 = M</text>
  <text class="t" x="710" y="260">FC(32) + LeakyReLU</text>
  <text class="t" x="710" y="292">FC(32) + LeakyReLU</text>
  <text class="t" x="710" y="324">FC(D) + tanh</text>

  <rect class="box2" x="1035" y="120" width="300" height="170"/>
  <text class="h" x="1185" y="166">生成输出</text>
  <text class="t" x="1185" y="210">x_scaled in [-1,1]</text>
  <text class="t" x="1185" y="245">反归一化为 RawDec</text>

  <!-- Discriminator -->
  <rect class="box3" x="500" y="480" width="420" height="225"/>
  <text class="h" x="710" y="524">Discriminator D</text>
  <text class="t" x="710" y="568">输入：[x ; W_ref]</text>
  <text class="s" x="710" y="598">真实 x = TrainX，伪造 x = G(z,W_ref)</text>
  <text class="t" x="710" y="634">FC(32) + LeakyReLU</text>
  <text class="t" x="710" y="666">FC(32) + LeakyReLU</text>
  <text class="t" x="710" y="698">FC(1) + Sigmoid</text>

  <rect class="box3" x="1035" y="505" width="300" height="155"/>
  <text class="h" x="1185" y="552">判别输出</text>
  <text class="t" x="1185" y="596">score in [0,1]</text>
  <text class="s" x="1185" y="626">真实标签 0.9，伪造标签 0</text>

  <!-- Loss -->
  <rect class="box" x="1470" y="290" width="335" height="190"/>
  <text class="h" x="1637.5" y="335">训练目标</text>
  <text class="t" x="1637.5" y="378">BCE / Sigmoid CGAN</text>
  <text class="s" x="1637.5" y="412">D: 区分真实边界解与生成解</text>
  <text class="s" x="1637.5" y="444">G: 让生成解被判为真实</text>

  <!-- Sampling output -->
  <rect class="box2" x="1470" y="585" width="335" height="170"/>
  <text class="h" x="1637.5" y="628">采样输出</text>
  <text class="t" x="1637.5" y="672">RawDec = G(z, QueryC)</text>
  <text class="s" x="1637.5" y="704">裁剪到变量边界</text>
  <text class="s" x="1637.5" y="732">Problem.Evaluation -> OffspringG</text>

  <!-- Arrows: training generator to discriminator -->
  <path class="line" d="M 380 205 L 482 205"/>
  <polygon class="arrow" points="500,205 482,195 482,215"/>

  <path class="line" d="M 920 205 L 1017 205"/>
  <polygon class="arrow" points="1035,205 1017,195 1017,215"/>

  <path class="line" d="M 1185 290 C 1185 415 955 415 920 560"/>
  <polygon class="arrow" points="916,480 906,498 926,498"/>

  <path class="line" d="M 380 205 C 440 385 450 590 482 590"/>
  <polygon class="arrow" points="500,590 482,580 482,600"/>

  <path class="line" d="M 920 590 L 1017 590"/>
  <polygon class="arrow" points="1035,590 1017,580 1017,600"/>

  <path class="line" d="M 1335 590 C 1430 590 1430 435 1452 405"/>
  <polygon class="arrow" points="1470,390 1448,394 1460,410"/>

  <path class="line" d="M 1335 205 C 1430 205 1430 335 1452 355"/>
  <polygon class="arrow" points="1470,370 1460,350 1448,366"/>

  <!-- Sampling path -->
  <path class="line" d="M 380 448 L 482 448 C 482 330 500 300 500 245"/>
  <polygon class="arrow" points="500,227 490,245 510,245"/>

  <path class="line" d="M 1185 290 C 1185 720 1420 670 1452 670"/>
  <polygon class="arrow" points="1470,670 1452,660 1452,680"/>
</svg>
