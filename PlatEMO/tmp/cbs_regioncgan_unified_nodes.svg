<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: #ffffff; stroke: #d9e2ff; stroke-width: 2.4; rx: 18; ry: 18; }
      .layer { fill: #ffffff; stroke: #2f5cff; stroke-width: 3; rx: 18; ry: 18; }
      .neuron { fill: #0f62d8; }
      .arrowLine { stroke: #222222; stroke-width: 2.4; fill: none; }
      .arrowHead { fill: #222222; }
      .dash { stroke: #555555; stroke-width: 2.2; fill: none; stroke-dasharray: 7 7; }
      .title { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 36px; font-weight: 700; text-anchor: middle; }
      .section { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 27px; font-weight: 700; text-anchor: start; }
      .label { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .small { fill: #333333; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; text-anchor: middle; }
      .dots { fill: #111111; font-family: Arial, sans-serif; font-size: 29px; font-weight: 700; text-anchor: middle; }
      .tag { fill: #111111; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .note { fill: #333333; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="760"/>
  <text class="title" x="750" y="54">Region-CGAN 统一网络结构</text>
  <rect class="outer" x="55" y="92" width="1390" height="610"/>

  <text class="section" x="95" y="138">CGAN = Generator G + Discriminator D</text>
  <text class="note" x="750" y="675">G 生成区域条件候选解；D 判断给定区域内的决策是真实边界解还是生成解。</text>

  <!-- Generator row -->
  <text class="tag" x="125" y="225">G</text>
  <rect class="layer" x="190" y="175" width="92" height="158"/>
  <circle class="neuron" cx="236" cy="205" r="12"/>
  <circle class="neuron" cx="236" cy="241" r="12"/>
  <text class="dots" x="236" y="283">⋮</text>
  <circle class="neuron" cx="236" cy="309" r="12"/>
  <text class="label" x="236" y="360">输入层</text>
  <text class="small" x="236" y="384">z + W_ref</text>

  <rect class="layer" x="435" y="175" width="92" height="158"/>
  <circle class="neuron" cx="481" cy="205" r="12"/>
  <circle class="neuron" cx="481" cy="241" r="12"/>
  <text class="dots" x="481" y="283">⋮</text>
  <circle class="neuron" cx="481" cy="309" r="12"/>
  <text class="label" x="481" y="360">隐藏层 1</text>
  <text class="small" x="481" y="384">32</text>

  <rect class="layer" x="680" y="175" width="92" height="158"/>
  <circle class="neuron" cx="726" cy="205" r="12"/>
  <circle class="neuron" cx="726" cy="241" r="12"/>
  <text class="dots" x="726" y="283">⋮</text>
  <circle class="neuron" cx="726" cy="309" r="12"/>
  <text class="label" x="726" y="360">隐藏层 2</text>
  <text class="small" x="726" y="384">32</text>

  <rect class="layer" x="925" y="175" width="92" height="158"/>
  <circle class="neuron" cx="971" cy="205" r="12"/>
  <circle class="neuron" cx="971" cy="241" r="12"/>
  <text class="dots" x="971" y="283">⋮</text>
  <circle class="neuron" cx="971" cy="309" r="12"/>
  <text class="label" x="971" y="360">输出层</text>
  <text class="small" x="971" y="384">x_fake</text>

  <!-- Generator arrows -->
  <path class="arrowLine" d="M 282 254 L 412 254"/>
  <polygon class="arrowHead" points="435,254 412,242 412,266"/>
  <path class="arrowLine" d="M 527 254 L 657 254"/>
  <polygon class="arrowHead" points="680,254 657,242 657,266"/>
  <path class="arrowLine" d="M 772 254 L 902 254"/>
  <polygon class="arrowHead" points="925,254 902,242 902,266"/>

  <!-- Discriminator row -->
  <text class="tag" x="125" y="528">D</text>
  <rect class="layer" x="190" y="478" width="92" height="158"/>
  <circle class="neuron" cx="236" cy="508" r="12"/>
  <circle class="neuron" cx="236" cy="544" r="12"/>
  <text class="dots" x="236" y="586">⋮</text>
  <circle class="neuron" cx="236" cy="612" r="12"/>
  <text class="label" x="236" y="455">输入层</text>
  <text class="small" x="236" y="659">x_real / x_fake + W_ref</text>

  <rect class="layer" x="435" y="478" width="92" height="158"/>
  <circle class="neuron" cx="481" cy="508" r="12"/>
  <circle class="neuron" cx="481" cy="544" r="12"/>
  <text class="dots" x="481" y="586">⋮</text>
  <circle class="neuron" cx="481" cy="612" r="12"/>
  <text class="label" x="481" y="455">隐藏层 1</text>
  <text class="small" x="481" y="659">32</text>

  <rect class="layer" x="680" y="478" width="92" height="158"/>
  <circle class="neuron" cx="726" cy="508" r="12"/>
  <circle class="neuron" cx="726" cy="544" r="12"/>
  <text class="dots" x="726" y="586">⋮</text>
  <circle class="neuron" cx="726" cy="612" r="12"/>
  <text class="label" x="726" y="455">隐藏层 2</text>
  <text class="small" x="726" y="659">32</text>

  <rect class="layer" x="925" y="478" width="92" height="158"/>
  <circle class="neuron" cx="971" cy="508" r="12"/>
  <text class="dots" x="971" y="562">⋮</text>
  <circle class="neuron" cx="971" cy="612" r="12"/>
  <text class="label" x="971" y="455">输出层</text>
  <text class="small" x="971" y="659">score</text>

  <!-- Discriminator arrows -->
  <path class="arrowLine" d="M 282 557 L 412 557"/>
  <polygon class="arrowHead" points="435,557 412,545 412,569"/>
  <path class="arrowLine" d="M 527 557 L 657 557"/>
  <polygon class="arrowHead" points="680,557 657,545 657,569"/>
  <path class="arrowLine" d="M 772 557 L 902 557"/>
  <polygon class="arrowHead" points="925,557 902,545 902,569"/>

  <!-- G to D connection -->
  <path class="dash" d="M 1017 254 L 1135 254 L 1135 430 L 236 430 L 236 455"/>
  <polygon class="arrowHead" points="236,478 224,455 248,455"/>
  <text class="note" x="1148" y="236">生成 x_fake 输入 D</text>
</svg>
